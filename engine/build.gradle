// Engine tasks derived from the LV Labs CircuitJS fork. See ../LICENSE.
plugins { id 'java' }

// Keep generated runtime assets at the app's established build paths.
layout.buildDirectory = file('../build')
repositories { mavenCentral() }
sourceCompatibility = 8
targetCompatibility = 8
sourceSets {
    main { java.srcDirs = [] }
    engine { java.srcDirs = ['../build/engine-source/src', 'integration'] }
}
dependencies {
    engineImplementation 'com.google.gwt:gwt-user:2.8.2'
    engineImplementation 'com.google.gwt:gwt-dev:2.8.2'
}
tasks.register('prepareEngine', Exec) {
    group 'circuitjs1'
    description 'Validate the upstream pin and prepare patched disposable sources'
    workingDir projectDir.parentFile
    commandLine 'python3', 'tools/prepare_engine.py'
}
tasks.named('compileEngineJava') { dependsOn 'prepareEngine' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// Engine and runtime build for the standalone React simulator.
tasks.register('compileEngine', JavaExec) {
    group 'circuitjs1'
    description 'Compile the pinned upstream engine with isolated integration sources'
    dependsOn 'engineClasses'
    classpath = sourceSets.engine.runtimeClasspath + files('../build/engine-source/src', 'integration')
    mainClass = 'com.google.gwt.dev.Compiler'
    maxHeapSize = '1024m'
    systemProperty 'gwt.persistentunitcache', 'false'
    doFirst { delete layout.buildDirectory.dir('engine') }
    args '-war', layout.buildDirectory.dir('engine').get().asFile.absolutePath,
         '-localWorkers', '2', '-sourceLevel', '1.8', '-style', 'PRETTY',
         'com.lushprojects.circuitjs1.engine'
}

tasks.register('compileEngineWorker', JavaExec) {
    group 'circuitjs1'
    description 'Compile a DOM-free bootstrap for the simulation worker'
    dependsOn 'engineClasses'
    classpath = sourceSets.engine.runtimeClasspath + files('../build/engine-source/src', 'integration')
    mainClass = 'com.google.gwt.dev.Compiler'
    maxHeapSize = '1024m'
    systemProperty 'gwt.persistentunitcache', 'false'
    doFirst { delete layout.buildDirectory.dir('engine-worker') }
    args '-war', layout.buildDirectory.dir('engine-worker').get().asFile.absolutePath,
         '-localWorkers', '2', '-sourceLevel', '1.8', '-style', 'PRETTY',
         'com.lushprojects.circuitjs1.worker'
}

// The browser verification harness loads one deterministic core asset. The package
// also retains its native ESM entry for independent frontend consumers.
def coreBrowserBundle = layout.buildDirectory.file('core/browser.js')
tasks.register('bundleCircuitCore') {
    inputs.dir('../packages/circuit-core')
    outputs.file(coreBrowserBundle)
    doLast {
        def modules = file('../packages/circuit-core/index.mjs').readLines().findResults { line ->
            def match = line =~ /^import '\.\/(.+)';$/
            match.matches() ? match[0][1] : null
        }
        def target = coreBrowserBundle.get().asFile
        target.parentFile.mkdirs()
        target.text = '// Generated from packages/circuit-core; edit the source modules.\n' +
            modules.collect { name -> "// ${name}\n" + file("../packages/circuit-core/${name}").getText('UTF-8') }.join('\n')
    }
}

tasks.register('makeEngineSite', Sync) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    group 'circuitjs1'
    description 'Assemble the simulation runtime and browser verification harness'
    dependsOn 'compileEngine', 'compileEngineWorker', 'bundleCircuitCore'
    into layout.buildDirectory.dir('engine-site')
    from(layout.buildDirectory.dir('engine'))
    from(layout.buildDirectory.dir('engine-worker'))
    from('../packages/circuit-runtime')
    from('../tools/engine-harness')
    from(layout.buildDirectory.dir('core')) {
        into 'core'
    }
    from('../packages/circuit-core') {
        into 'core'
    }
    from('../docs/new-simulator/examples') {
        include '*.json'
        into 'examples'
    }
}

